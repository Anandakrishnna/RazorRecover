<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archify — Mermaid to Interactive HTML/SVG Converter</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --bg: #090d16;
      --panel: rgba(17, 24, 39, 0.85);
      --border: rgba(255, 255, 255, 0.1);
      --cyan: #00f2fe;
      --blue: #3b82f6;
      --text: #f3f4f6;
      --text-sub: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    header {
      padding: 1.25rem 2rem;
      background: rgba(9, 13, 22, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #090d16;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      text-transform: uppercase;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--cyan));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .main { display: flex; flex: 1; height: calc(100vh - 70px); }

    .editor-pane {
      width: 380px;
      background: var(--panel);
      border-right: 1px solid var(--border);
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    textarea {
      flex: 1;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1rem;
      color: #a7f3d0;
      font-family: monospace;
      font-size: 0.85rem;
      resize: none;
      outline: none;
    }

    textarea:focus { border-color: var(--cyan); }

    .btn {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      color: #090d16;
      font-weight: 700;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: opacity 0.2s ease;
    }

    .btn:hover { opacity: 0.9; }

    .canvas-pane {
      flex: 1;
      padding: 2.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: auto;
    }

    .mermaid-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      max-width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <div style="display:flex; align-items:center; gap:1rem;">
      <span class="badge">Archify Converter</span>
      <h1>Mermaid → Interactive HTML/SVG Diagram</h1>
    </div>
  </header>

  <div class="main">
    <div class="editor-pane">
      <div style="font-weight:600; font-size:0.9rem; color:var(--cyan);">Paste Mermaid Diagram Input:</div>
      <textarea id="mermaid-input">flowchart TD
    A[Payment Failure Webhook] --> B[Revenue Monitor]
    B --> C[Root Cause Classifier]
    C --> D[Recovery Probability Model]
    D --> E[AI Recommender LLM]
    E --> F[Deterministic Policy Engine]
    F --> G[Tool Executor]
    G --> H[Verifier Engine]
    H --> I[SQLite Audit Log]
    I --> J[React Dashboard UI]</textarea>
      <button class="btn" onclick="renderMermaid()">⚡ Render Interactive Diagram</button>
    </div>

    <div class="canvas-pane">
      <div class="mermaid-box">
        <div class="mermaid" id="output"></div>
      </div>
    </div>
  </div>

  <script>
    mermaid.initialize({
      startOnLoad: true,
      theme: 'dark',
      flowchart: { curve: 'basis' }
    });

    async function renderMermaid() {
      const code = document.getElementById('mermaid-input').value;
      const output = document.getElementById('output');
      output.removeAttribute('data-processed');
      output.innerHTML = code;
      await mermaid.run({ nodes: [output] });
    }
  </script>
</body>
</html>
